<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>45/4</title>
  <meta name="description" content="45/4 — رفيقك الشخصي في النادي: ٤ أيام · خطة تناسب حسابك." />
  <meta name="theme-color" content="#FAF6EF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="45/4" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preload" href="/fonts/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/thmanyahserifdisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // تطبيق الوضع قبل أول رسم لتفادي الوميض
    (function () {
      try {
        var p = localStorage.getItem('45-4:theme') || 'system';
        var dark = p === 'dark' || (p === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var c = dark ? '#19120D' : '#FAF6EF';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
        document.documentElement.style.background = c;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root">
    <div id="boot" style="min-height:100dvh;display:flex;align-items:center;justify-content:center">
      <div style="font-family:'Thmanyah Serif Display',serif;font-weight:900;font-size:64px;letter-spacing:-.02em;direction:ltr;opacity:.9;color:#C67A3D">45/4</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
